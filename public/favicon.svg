<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Accent -->
  <path d="M256 96 L368 144 V248 C368 320 318 386 256 416 C194 386 144 320 144 248 V144 L256 96 Z" 
        fill="url(#shieldGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="12"/>

  <!-- Vault Lock Body -->
  <rect x="184" y="224" width="144" height="120" rx="24" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- Lock Shackle -->
  <path d="M216 224 V184 C216 161.909 233.909 144 256 144 C278.091 144 296 161.909 296 184 V224" 
        stroke="#ffffff" stroke-width="24" stroke-linecap="round" fill="none"/>

  <!-- Keyhole & Dial Circle -->
  <circle cx="256" cy="272" r="20" fill="#4f46e5"/>
  <path d="M256 284 V312" stroke="#4f46e5" stroke-width="12" stroke-linecap="round"/>

  <!-- AI Sparkle 1 (Top Right) -->
  <path d="M384 100 Q384 124 408 124 Q384 124 384 148 Q384 124 360 124 Q384 124 384 100 Z" fill="#fbbf24"/>
  
  <!-- AI Sparkle 2 (Bottom Left) -->
  <path d="M128 360 Q128 376 144 376 Q128 376 128 392 Q128 376 112 376 Q128 376 128 360 Z" fill="#38bdf8"/>
</svg>